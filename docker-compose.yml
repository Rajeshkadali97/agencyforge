services:
  runtime:
    build:
      context: .
      target: runtime
    container_name: agencyforge-runtime
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      NODE_ENV: production
      RUNTIME_PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      AGENCYFORGE_DB_PATH: /app/data/agencyforge.db
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - runtime-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: agencyforge-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_RUNTIME_URL: http://localhost:3001
      RUNTIME_BRIDGE_URL: http://runtime:3001
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-}
    depends_on:
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  runtime-data:
    driver: local
