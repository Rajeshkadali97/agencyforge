<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AgencyForge: the operating system for your autonomous AI agency">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.65" stop-color="#140F2B"/>
      <stop offset="1" stop-color="#22123B"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="640" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="0.5" stop-color="#E5408B"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="title" x1="70" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CDBEFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="900" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#E5408B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0B0F1A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="shot"><rect x="692" y="120" width="512" height="400" rx="20"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- dashboard screenshot -->
  <g filter="url(#shadow)">
    <rect x="688" y="116" width="520" height="408" rx="24" fill="url(#brand)"/>
    <rect x="692" y="120" width="512" height="400" rx="20" fill="#EEF2EF"/>
    <image href="screenshots/01-headquarters.png" xlink:href="screenshots/01-headquarters.png" x="692" y="120" width="512" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#shot)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="150" font-size="20" font-weight="700" letter-spacing="5" fill="#FF9F5A">OPEN SOURCE · MIT · TYPESCRIPT</text>
    <text x="68" y="252" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">AgencyForge</text>
    <rect x="72" y="278" width="170" height="8" rx="4" fill="url(#brand)"/>
    <text x="72" y="352" font-size="30" font-weight="500" fill="#D9D4F5">Give an AI team a goal.</text>
    <text x="72" y="394" font-size="30" font-weight="500" fill="#D9D4F5">Watch it plan, hand off and deliver.</text>
    <g font-size="19" font-weight="600" fill="#E9E6FF">
      <rect x="72" y="450" width="176" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="160" y="480" text-anchor="middle">No API keys</text>
      <rect x="262" y="450" width="148" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="336" y="480" text-anchor="middle">Live data</text>
      <rect x="424" y="450" width="176" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="512" y="480" text-anchor="middle">1,700+ APIs</text>
    </g>
  </g>
</svg>
